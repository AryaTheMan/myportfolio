    <!-- Apply the persisted/system theme before first paint to avoid a light-mode flash.
         Must mirror the logic in src/context/ThemeContext.jsx (getInitialTheme). -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('ab-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.getElementById('theme-color')
          if (meta) meta.setAttribute('content', dark ? '#0A0A0C' : '#FAFAFA')
        } catch {
          /* localStorage unavailable — fall back to the default light theme */
        }
      })()
    </script>

    <!-- Opt out of the browser's native scroll restoration as early as possible
         (inline, before the deferred bundle runs) so a reload always starts at
         the top instead of wherever the visitor last scrolled. -->
    <script>
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual'
      }
    </script>
